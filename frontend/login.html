<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Авторизация | Опросы РЖД</title>
    <link rel="stylesheet" href="login-styles.css">
</head>
<body>
    <div class="login-wrapper">
        <img src="images/RZDlogo.png" alt="РЖД Логотип" class="logo-img">
        <form id="loginForm">
            <div class="input-group">
                <label for="username">Табельный номер</label>
                <input type="text" id="username" required placeholder="Введите логин">
            </div>
            <div class="input-group">
                <label for="password">Пароль</label>
                <input type="password" id="password" required placeholder="Введите пароль">
            </div>
            <button type="submit" class="btn-submit">Войти в систему</button>
        </form>
    </div>
    <script src="login.js"></script>
</body>
</html>
