<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Авторизация | Опросы РЖД</title>
    <link rel="stylesheet" href="login-styles.css">
</head>
<body>
    <div class="login-wrapper">
        <img src="images/RZDlogo.png" alt="РЖД Логотип" class="logo-img">
        <form id="loginForm">
            <div class="input-group">
                <label for="fullName">ФИО сотрудника</label>
                <input type="text" id="fullName" required placeholder="Иванов Иван Иванович">
            </div>
            <div class="input-group">
                <label>Предприятие / Подразделение</label>
                <button type="button" class="btn-select" onclick="app.openDepartmentModal()">
                    <span id="selectedDepartmentText" style="color: var(--text-muted);">Выберите из списка...</span>
                    <svg style="width:20px;height:20px;color:var(--text-muted)" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m9 18 6-6-6-6"/></svg>
                </button>
            </div>
            <button type="submit" class="btn-submit">Войти к тестам</button>
        </form>
        
        <div class="admin-footer">
            <a href="admin.html" class="btn-admin-link">Вход для администратора</a>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
